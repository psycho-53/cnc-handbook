{id:'cutting',cat:'handbook',title:'Обороты и минутная подача',subtitle:'Vc, n, fz, Vf',tags:['режимы','подача','обороты','фреза','формулы'],time:4,
 quick:'Для фрезерования: n = 1000 × Vc / (π × D); Vf = n × z × fz. Скорость резания Vc берут из данных производителя инструмента с учётом материала и условий.',

 sections:[{h:'Обозначения',p:'n — об/мин; Vc — м/мин; D — мм; z — число работающих зубьев; fz — мм/зуб; Vf — мм/мин. Все единицы должны совпадать с формулами.'},{h:'Расчёт на примере',p:'Фреза D10, z = 3, Vc = 160 м/мин, fz = 0,05 мм/зуб: n ≈ 5093 об/мин, Vf ≈ 764 мм/мин. Это математический расчёт, а не автоматически допустимый режим для любого инструмента.'},{h:'Что формулы НЕ учитывают',bullets:['Жёсткость станка, системы крепления и вылет инструмента.','Поправку на толщину стружки при малом радиальном зацеплении.','Снижение реального диаметра резания у сферических фрез.','Влияние СОЖ, покрытия, твёрдости и геометрии инструмента.']}],linked:['chip','vibration','material'],sources:['sandvik']},
{id:'chip',cat:'theory',title:'Толщина стружки и перекрытие ae',subtitle:'Почему маленькая ширина не всегда означает маленькую подачу',tags:['chip thinning','ae','стружка','подача'],time:5,
 quick:'При небольшом радиальном зацеплении максимальная толщина стружки может быть существенно меньше подачи на зуб. Поэтому простое уменьшение fz иногда приводит к трению и износу.',

 sections:[{h:'Физический смысл',p:'Зуб входит в материал под изменяющимся углом. Из-за этого мгновенная толщина снимаемого слоя отличается от заданной подачи на зуб.'},{h:'Когда особенно важно',bullets:['Высокоскоростные и динамические траектории с небольшим ae.','Тонкостенные детали, где изменяется зацепление.','Чистовые проходы со слишком малым припуском.']},{h:'Практическое ограничение',p:'Нельзя увеличивать fz «по таблице коэффициентов» без проверки угла в плане, геометрии инструмента и рекомендаций производителя.'}],linked:['cutting','wear','strategy'],sources:['sandvik','vibration']},
{id:'tolerances',cat:'handbook',title:'Допуски и посадки',subtitle:'Что значит H7, h6 и предельный размер',tags:['H7','отверстие','вал','посадка','допуск','ISO 286'],time:5,
 quick:'Обозначение Ø20 H7 — это не размер 20,000 ± 0,007. Буква задаёт положение поля допуска, цифра — квалитет. Численные отклонения зависят от номинального размера.',
 actions:['Сначала найди номинальный размер и обозначение поля допуска.','Определи верхнее и нижнее отклонение по действующему стандарту/таблице.','Выбери измерительный инструмент по требуемой точности.'],
 sections:[{h:'Как читать обозначение',p:'Заглавные буквы относятся к отверстиям, строчные — к валам. H — поле допуска отверстия с нулевым нижним отклонением в стандартной системе ISO; для h у вала нулевое верхнее отклонение.'},{h:'Что такое посадка',bullets:['Посадка с зазором: между сопрягаемыми деталями предусмотрен зазор.','Посадка с натягом: предусмотрено перекрытие размеров.','Переходная: возможны зазор или натяг в зависимости от фактических размеров.']},{h:'Почему нельзя угадывать',p:'Одинаковое «H7» при разных номиналах имеет разную численную ширину поля допуска. Для ответственной детали используй указанную на чертеже редакцию стандарта и полноценную таблицу ISO 286 / ГОСТ.'}],linked:['metrology','dim-error','bases'],sources:[]},
{id:'roughness',cat:'handbook',title:'Шероховатость Ra и Rz',subtitle:'Что проверяет контролёр',tags:['Ra','Rz','чистота','шероховатость','поверхность'],time:4,
 quick:'Ra — среднее арифметическое абсолютных отклонений профиля на установленной длине оценки. Rz описывает высоту профиля по другой методике. Напрямую переводить Ra в Rz постоянным коэффициентом нельзя.',
 actions:['Проверь обозначение параметра и условия измерения на чертеже.','Не оценивай Ra «на глаз» по блеску поверхности.','Для значимых требований используй профилометр и согласованную методику.'],
 sections:[{h:'Что влияет',bullets:['Биение, состояние и геометрия инструмента.','Подача на зуб, траектория и остаточный гребешок.','Вибрации, налипание материала, подача СОЖ.']},{h:'Полезное различие',p:'Хороший внешний вид не гарантирует выполнение Ra. И наоборот: разные направления рисок могут давать сопоставимые измеренные значения.'}],linked:['poor-finish','cutting','metrology'],sources:[]},
{id:'metrology',cat:'handbook',title:'Чем измерять отверстия и размеры',subtitle:'Штангенциркуль, микрометр, нутромер, калибр',tags:['нутромер','микрометр','скоба','калибр','измерение'],time:4,
 quick:'Измерительный инструмент выбирают по диапазону, неопределённости измерения, доступу к поверхности и требованиям чертежа. Штангенциркуль не заменяет нутромер для точного контроля отверстий.',
 actions:['Определи допуск и геометрию контролируемой поверхности.','Проверь поверку/калибровку и настройку средства измерения.','Измеряй после температурной стабилизации при необходимости.'],
 sections:[{h:'Типовые средства',bullets:['Микрометр — точный наружный размер при корректном применении.','Нутромер — контроль внутреннего диаметра, овальности и конусности в нескольких сечениях.','Пробка ПР/НЕ — контроль годности отверстия в рамках назначения калибра.','Индикатор — проверка биения, соосности и взаимного положения.']},{h:'Не только диаметр',p:'Отверстие может иметь правильный размер в одной точке, но овальность или конусность. Для ответственной посадки учитывай геометрические допуски.'}],linked:['tolerances','dim-error'],sources:[]},
{id:'coolant',cat:'handbook',title:'СОЖ и отвод стружки',subtitle:'Охлаждение, смазывание, эвакуация',tags:['СОЖ','эмульсия','стружка','M08','M09'],time:3,
 quick:'СОЖ нужна не только для охлаждения. В зависимости от операции она помогает смазывать зону резания и уносить стружку. Сухая обработка и подача СОЖ должны соответствовать инструменту и материалу.',
 actions:['Проверь концентрацию, направление струи и фильтрацию по регламенту.','Убедись, что стружка не набивается в карман и на кромку.','Не переключай сухую/мокрую обработку без учёта материала и рекомендаций производителя.'],
 sections:[{h:'Типовые ошибки',bullets:['Струя не попадает в зону резания.','Загрязнённая эмульсия или недостаточный напор.','Плохой отвод длинной стружки из глубокого кармана или отверстия.']},{h:'Что помнить',p:'Для некоторых режимов и материалов прерывистое охлаждение может быть нежелательным. Сверяй рекомендации для конкретного инструмента.'}],linked:['wear','drilling','chipping'],sources:[]},
{id:'vibration',cat:'problems',title:'Вибрация и дребезг',subtitle:'Чаттер при фрезеровании',tags:['вибрация','чаттер','шум','дребезг','вынос'],time:5,
 quick:'Начни с осмотра закрепления детали, вылета инструмента, состояния кромок и патрона. Затем оцени обороты, ae, ap и траекторию: причина может быть в резонансе, а не просто в «большой подаче».',
 actions:['Проверь зажим детали и короткий, жёсткий вылет инструмента.','Осмотри инструмент, биение и крепление в патроне.','Сопоставь вибрацию с входом в углы, глубиной и шириной зацепления.','Если вибрация сохраняется — корректируй режимы контролируемо, по одному фактору.'],
 sections:[{h:'Что происходит',p:'Переменная сила резания возбуждает колебания системы станок–инструмент–заготовка. При определённых условиях образуются самовозбуждающиеся колебания (чаттер). Они портят поверхность и ускоряют износ.'},{h:'Почему уменьшение подачи не всегда помогает',p:'Если фактическая толщина стружки станет слишком малой, фреза начинает больше тереть, чем резать. Устойчивость зависит не только от подачи, но и от сочетания частоты шпинделя и глубины резания.'},{h:'Что попробовать после проверки механики',bullets:['Изменить обороты и проверить звук/след на поверхности.','Снизить ae или ap, особенно в углах траектории.','Выбрать инструмент с более подходящей геометрией/числом зубьев.','Обеспечить равномерное зацепление и отсутствие резких входов.']},{h:'Когда остановиться',p:'При резком усилении звука, смещении детали, следах контакта державки или риске разрушения инструмента останови обработку безопасным способом по инструкции предприятия.'}],linked:['chip','climb','poor-finish'],sources:['vibration']},
{id:'chipping',cat:'problems',title:'Сколы режущих кромок',subtitle:'Если фреза быстро «выкрашивается»',tags:['сколы','поломка','кромка','твердосплавная','30ХГСА'],time:5,
 quick:'Сколы могут появляться из-за ударной нагрузки, вибрации, биения, неподходящего инструмента, термических перепадов или перегрузки. Уменьшать только обороты без диагностики — не всегда верно.',
 actions:['Осмотри характер повреждений: одиночный скол или сколы по всей рабочей длине.','Проверь биение, вылет, закрепление и фактические ap/ae.','Сравни реальную твёрдость материала с назначением марки сплава инструмента.','Проверь вход/выход из материала, углы, стружкоотвод и СОЖ.'],
 sections:[{h:'Сколы по всей рабочей длине',p:'Если повреждается вся контактная зона, стоит проверить большой ap, неравномерное радиальное зацепление, вибрацию, ударный вход и соответствие фрезы твёрдому материалу.'},{h:'Признаки для разделения причин',bullets:['Одна кромка страдает сильнее других — проверь биение и посадку инструмента.','Сколы преимущественно на входе/выходе — проверь удар и траекторию.','Сочетание сколов и сильного шума — проверь устойчивость системы.','Трещины и нестабильное охлаждение — проверь тепловой режим.']},{h:'Как корректировать',p:'Меняй по одному параметру и фиксируй результат. Желательно использовать рекомендованный диапазон производителя для конкретной фрезы, покрытия и материала.'}],linked:['vibration','wear','cutting'],sources:['vibration']},
{id:'wear',cat:'problems',title:'Быстрый износ фрезы',subtitle:'Истирание, кратер, налипание',tags:['износ','стойкость','фреза','затупление'],time:4,
 quick:'Износ — нормальная часть резания, но его ускоряют неправильная скорость, малая толщина стружки, неподходящая геометрия, перегрев и плохой стружкоотвод.',
 actions:['Отличи равномерный износ задней поверхности от сколов и налипания.','Проверь Vc и рекомендуемый диапазон для материала.','Оцени ae, fz и фактическую толщину стружки.'],
 sections:[{h:'Возможные механизмы',bullets:['Абразивный износ — постепенное стачивание поверхности.','Наростообразование — прилипание материала к кромке с последующим отрывом.','Пластическая деформация — перегрев и механическая нагрузка на кромку.','Термические трещины — в частности, при неблагоприятных циклах нагрева/охлаждения.']},{h:'Не перепутай',p:'Инструмент, затупившийся постепенно, и инструмент, у которого выкрошились кромки за один проход, требуют разных диагностических действий.'}],linked:['chip','chipping','coolant'],sources:['sandvik']},
{id:'poor-finish',cat:'problems',title:'Плохая чистота поверхности',subtitle:'Риски, волна, задиры, налипание',tags:['шероховатость','Ra','полосы','риски'],time:4,
 quick:'По виду следов можно предположить причину: регулярная волна часто указывает на вибрацию, задиры — на трение или налипание, повторяющиеся риски — на биение или след режущих кромок.',
 actions:['Сравни следы с направлением проходов.','Проверь биение, износ, СОЖ и отсутствие повторного резания стружки.','Проверь припуск, подачу и шаг чистовой траектории.'],
 sections:[{h:'Типичные факторы',bullets:['Излишний вылет или слабое закрепление.','Неподходящая геометрия фрезы.','Слишком большой шаг между чистовыми проходами.','Неравномерный оставшийся припуск после черновой обработки.']},{h:'Контроль результата',p:'Для нормируемой шероховатости используй требуемый метод измерения: внешний вид сам по себе не доказывает выполнение Ra.'}],linked:['roughness','vibration','allowance'],sources:['vibration']},
{id:'dim-error',cat:'problems',title:'Размер «уплывает»',subtitle:'Несоответствие размера и формы',tags:['размер','конусность','погрешность','коррекция','температура'],time:5,
 quick:'Перед коррекцией программы исключи ошибки измерения, смещение детали, биение инструмента, температурные изменения и неверную коррекцию. Отклонение размера не всегда лечится изменением радиуса фрезы.',
 actions:['Проверь измерение и температуру детали.','Убедись, что база не сместилась после черновой обработки.','Проверь корректор радиуса/длины и реальный инструмент.','Сопоставь направление и повторяемость отклонения.'],
 sections:[{h:'По характеру ошибки',bullets:['Постоянное смещение размера — вероятны коррекция, база или фактический диаметр.','Разные размеры в начале и конце — проверь нагрев, закрепление и прогиб.','Конусность или бочка — возможны деформация, вылет, непараллельность и траектория.']},{h:'Правило безопасной коррекции',p:'Не вноси компенсации «вслепую». Зафиксируй фактический размер, требуемую поправку и логику знака корректора для конкретного станка.'}],linked:['tolerances','metrology','work-offset'],sources:[]},
{id:'burrs',cat:'problems',title:'Заусенцы на кромках',subtitle:'Выход инструмента из материала',tags:['заусенец','кромка','фаска','снятие'],time:3,
 quick:'Заусенцы зависят от пластичности материала, остроты кромки, направления выхода и режимов. Их уменьшение лучше учитывать ещё при разработке технологии.',
 actions:['Проверь затупление фрезы и выход из материала.','Оцени возможность изменить направление заключительного прохода.','Добавь контролируемую операцию снятия заусенцев, если это требуется чертежом.'],
 sections:[{h:'Технологические варианты',bullets:['Продуманная последовательность обработки отверстий и контуров.','Фаска или обработка кромки отдельным инструментом.','Минимизация образования крупного заусенца за счёт геометрии и резания.']},{h:'Осторожно',p:'Удаление заусенцев не должно изменять размер, плоскостность или критический профиль детали.'}],linked:['operations','poor-finish'],sources:[]},
{id:'bases',cat:'technology',title:'Базирование и закрепление',subtitle:'Как деталь лишается степеней свободы',tags:['база','3-2-1','установ','зажим','приспособление'],time:6,
 quick:'Базирование определяет положение заготовки относительно станка; закрепление сохраняет его под действием сил резания. Выбирай базы от требований чертежа и реальной доступности поверхностей.',
 actions:['Найди на чертеже размерные и конструкторские базы.','Определи, какие поверхности доступны и уже обработаны.','Проверь жёсткость, доступ инструмента и повторяемость переустановки.'],
 sections:[{h:'Принцип 3–2–1',p:'В типовой схеме для жёсткой призматической детали три точки опоры ограничивают три степени свободы, две — ещё две, одна — последнюю. Это объяснительная модель; реальная схема определяется геометрией, контактами и фиксацией.'},{h:'База и ноль программы — не одно и то же',p:'Физические базы задают положение детали в приспособлении. Нулевую точку G54 выбирают так, чтобы удобно программировать и измерять деталь; она может совпадать с размерной базой, но это не обязательно.'},{h:'Риск лишнего зажима',p:'Сильный зажим тонкой детали может деформировать её. После разжатия размер и форма меняются.'}],linked:['operations','work-offset','thin-walls'],sources:[]},
{id:'operations',cat:'technology',title:'Последовательность операций и установов',subtitle:'От заготовки до годной детали',tags:['технология','операция','установ','черновая','чистовая'],time:6,
 quick:'Планируй маршрут от базирования и контроля: где снять припуск, когда сформировать точные базы, какие поверхности оставить на последующую обработку и как проверить размеры.',
 actions:['Отметь требуемые базы и доступность в каждом установе.','Раздели черновую, получистовую и чистовую обработку.','Учти деформации, промежуточный контроль и снятие заусенцев.'],
 sections:[{h:'Пример рассуждения',p:'Для призматической детали с карманом и отверстиями сначала выбирают устойчивое закрепление и обрабатывают доступные элементы; затем при необходимости переворачивают деталь для обработки второй стороны. Но порядок сверления и фрезерования диктуется конкретным чертежом, припусками и базами.'},{h:'Что нельзя забыть',bullets:['Захват и доступность инструмента на каждом установе.','Силы резания и смещение слабой заготовки.','Контроль ответственных размеров до снятия с базы.','Остаточный припуск на шлифование/развёртывание, если предусмотрено.']},{h:'Хорошая технология',p:'Это не всегда минимум операций. Важнее повторяемость, качество, безопасная обработка и обоснованное машинное время.'}],linked:['bases','allowance','strategy'],sources:[]},
{id:'allowance',cat:'technology',title:'Припуски на обработку',subtitle:'Что оставить под чистовую и шлифование',tags:['припуск','черновая','чистовая','шлифование'],time:5,
 quick:'Припуск — материал, снимаемый на следующем этапе. Его выбирают по разбросу заготовки, погрешностям базирования, ожидаемой деформации и возможностям следующей операции.',
 actions:['Проверь исходные размеры заготовки и допуски.','Раздели припуск на общее снятие и остаток под последующие операции.','Учитывай, что припуск на сторону и на диаметр — разные величины.'],
 sections:[{h:'Важно для отверстий',p:'Если оставляешь материал под развёртывание или растачивание, учитывай назначение операции, фактическое качество предварительного отверстия и рекомендации по инструменту. Универсального припуска «для всех Ø» нет.'},{h:'Почему слишком маленький припуск опасен',bullets:['Не хватает материала для исправления формы/биения.','Инструмент может работать с нестабильной толщиной стружки.','После термообработки или снятия зажима геометрия может измениться.']},{h:'Почему слишком большой тоже плох',p:'Растёт нагрузка на чистовой инструмент, температурные деформации и риск вибраций. Перераспределяй материал на черновую и получистовую.'}],linked:['operations','chip','tolerances'],sources:[]},
{id:'climb',cat:'technology',title:'Попутное и встречное фрезерование',subtitle:'Направление подачи относительно вращения',tags:['попутное','встречное','climb','conventional'],time:4,
 quick:'В попутном фрезеровании толщина стружки обычно уменьшается от максимума к нулю; во встречном растёт от нуля. На жёстких ЧПУ попутное часто предпочтительнее, но есть исключения.',
 actions:['Определи направление вращения и движение кромки в зоне контакта.','Учти люфты, жёсткость, материал, зажим и особенности входа в резание.','Проверь выбранное направление в CAM, а не только на рисунке.'],
 sections:[{h:'Попутное',p:'Режущая кромка начинает резать более толстой стружкой и выходит с меньшей. Может давать хорошие условия резания при жёсткой системе, но силы способны подтягивать деталь/стол при люфтах.'},{h:'Встречное',p:'Зуб начинает с малой толщины слоя, что может увеличивать трение на входе; при этом направление сил иногда удобнее для недостаточно жёсткого закрепления.'},{h:'Универсального правила нет',p:'Правильный выбор зависит от траектории, механики станка и крепления, а также рекомендаций по инструменту.'}],linked:['vibration','strategy','chip'],sources:['vibration']},
{id:'strategy',cat:'technology',title:'Черновые стратегии в CAM',subtitle:'Постоянное зацепление, карманы, углы',tags:['CAM','Mastercam','NX','траектория','карман','adaptive'],time:5,
 quick:'Для черновой обработки важна контролируемая нагрузка на инструмент. Траектория с примерно постоянным радиальным зацеплением часто стабильнее обычного кармана с резкими перегрузками в углах.',
 actions:['Проверь максимальное ae на всей траектории.','Обеспечь безопасный вход — рампа, спираль или предварительное отверстие, если это допускает инструмент.','Проверь симуляцию, припуски и переходы между уровнями.'],
 sections:[{h:'Обычная карманная обработка',p:'Может быть эффективна для простых карманов и небольших съёмов, но в острых внутренних углах ширина зацепления фрезы возрастает.'},{h:'Динамическая/адаптивная',p:'Позволяет поддерживать близкую к выбранной нагрузку за счёт управляемого бокового врезания. При этом режимы и предельные перемещения всё равно нужно проверить.'},{h:'Что должен проверить программист',bullets:['Вход/выход и погружение по Z.','Оставленный припуск по стенкам и дну.','Безопасные плоскости и столкновения.','Постпроцессор и особенности конкретного станка.']}],linked:['chip','allowance','operations'],sources:['sandvik']},
{id:'thin-walls',cat:'technology',title:'Тонкие стенки и деформация',subtitle:'Не снимай опору раньше времени',tags:['тонкостенная','деформация','жесткость'],time:5,
 quick:'Для тонкостенной детали опасны упругая деформация от сил резания и деформация от зажима. Порядок съёма материала иногда важнее максимальной производительности.',
 actions:['Сохраняй жёсткие участки до поздних операций, если это возможно.','Продумай опоры близко к зоне резания.','Используй умеренную и равномерную нагрузку, контролируй форму после раскрепления.'],
 sections:[{h:'Откуда берётся ошибка',p:'При резании стенка прогибается, и после снятия нагрузки возвращается. Или деталь меняет форму после отпускания зажимов — размер в станке и после снятия различается.'},{h:'Методы',bullets:['Симметричный съём припуска, когда это уместно.','Чистовая обработка при минимальной нагрузке.','Многопроходная обработка с промежуточным контролем.'] }],linked:['bases','operations','dim-error'],sources:[]},
{id:'work-offset',cat:'controls',title:'G54, G55 и ноль детали',subtitle:'Рабочая система координат',tags:['G54','G55','нулевая точка','координаты','Siemens','Fanuc','Haas'],time:5,
 quick:'G54 и G55 выбирают сохранённые системы координат детали. Физически это связь между нулём станка и выбранным нулём программы. Перед стартом проверяй активную систему и её значения.',
 actions:['Сверь чертёж, установленную деталь и выбранный ноль программы.','Проверь активную систему координат, смещения и повороты.','Проверь безопасную высоту и возможные габариты закрепления.'],
 sections:[{h:'Практический пример',p:'Если G54 установлен в углу верхней поверхности заготовки, запрограммированные X0 Y0 Z0 относятся именно к нему, а не к машинному нулю. Смена на G55 меняет рабочую привязку.'},{h:'Siemens и Fanuc/Haas',p:'На SINUMERIK 828D G54 также является устанавливаемым смещением нулевой точки. Но формат других команд, детали корректоров и циклов могут отличаться.'},{h:'Частая ошибка',p:'На экране выбран G55, а измерена и проверена была только G54. Это реальный риск смещения траектории и столкновения.'}],linked:['bases','tool-offsets','codes-guide'],sources:['haasProgramming','siemens']},
{id:'tool-offsets',cat:'controls',title:'Длина и радиус инструмента',subtitle:'Корректоры, H и D',tags:['H','D','G43','корректор','длина','радиус'],time:6,
 quick:'У Haas/Fanuc-подобного ISO-кода G43 H… обычно активирует коррекцию длины; коррекция радиуса связана с G41/G42 и регистром D. На Siemens 828D логика вызова инструмента и коррекции может отличаться.',
 actions:['Проверь соответствие установленного инструмента номеру и данным в таблице.','Проверь длину, радиус, износ и активные корректоры.','Не переноси привычки со стойки на стойку без руководства и постпроцессора.'],
 sections:[{h:'Зачем нужна коррекция длины',p:'Программный Z относится к вершине инструмента (в рамках принятой системы). Компенсация длины позволяет использовать разные инструменты без пересчёта геометрии траектории.'},{h:'Радиусная коррекция',p:'G41 и G42 смещают положение центра инструмента относительно программного контура. Смысл «слева/справа» определяется направлением движения по контуру.'},{h:'Осторожно с Siemens',p:'В SINUMERIK 828D используется собственная модель данных инструмента, режущих кромок и коррекций; команды T и D, вызовы смены инструмента и ISO-режим требуют сверки с конкретной конфигурацией.'}],linked:['work-offset','codes-guide','dim-error'],sources:['haasProgramming','siemens']},
{id:'codes-guide',cat:'controls',title:'Как читать G-коды без ошибок',subtitle:'Сначала система, затем конкретный код',tags:['G-code','G00','G01','G02','Fanuc','Haas','Sinumerik'],time:5,
 quick:'G-коды нельзя считать универсальным языком с одинаковыми значениями на всех стойках. Даже знакомые команды могут отличаться по режиму работы, параметрам и настройкам изготовителя станка.',
 actions:['Выбери конкретную систему и версию стойки.','Проверь режим программирования (DIN/ISO, ShopMill и др.).','Сверь код с руководством производителя станка и проверенным постпроцессором.'],
 sections:[{h:'Общие понятия',bullets:['G00 — быстрое позиционирование, G01 — линейная интерполяция с подачей.','G02/G03 — дуговая интерполяция по часовой/против часовой в выбранной плоскости.','G90/G91 — абсолютные/инкрементальные координаты.','G17/G18/G19 — выбор плоскости для соответствующих команд.']},{h:'Почему особенно важны циклы',p:'Синтаксис сверлильных циклов у Haas/Fanuc и SINUMERIK может быть разным. Код G81 из одной системы нельзя механически переносить на другую.'},{h:'Зачем отдельный справочник по стойкам',p:'Чтобы рядом с каждой командой указывать применимость, особенности и ссылку на документацию, а не печатать выдуманную «общую» таблицу.'}],linked:['work-offset','tool-offsets','run-check'],sources:['haas','siemens']},
{id:'run-check',cat:'controls',title:'Перед первым запуском программы',subtitle:'Что проверить до Cycle Start',tags:['первый запуск','single block','dry run','безопасность','симуляция'],time:5,
 quick:'Перед первым пуском сверяют программу, инструмент, корректоры, ноль детали, закрепление и безопасные перемещения. Симуляция помогает, но не заменяет реальную проверку станка.',
 actions:['Сверь номер программы и ревизию чертежа.','Проверь инструмент, его вылет, длину и радиус.','Проверь активное смещение G54/G55 и положение детали.','Проверь зажимы, СОЖ, ограничение оборотов и траектории.','Следуй процедуре первого запуска предприятия, контролируй перемещения.'],
 sections:[{h:'Частые упущения',bullets:['В программе используется иной инструмент или длина.','Не тот ноль детали после переналадки.','Безопасная высота проходит через прижим.','Некорректный постпроцессор или остаточные модальные состояния.']},{h:'Проверка',p:'Используй имитацию, проверку кода и предусмотренные инструкцией станка режимы пробного запуска. Поведение быстрых перемещений и симуляции зависит от конкретной машины.'}],linked:['tool-offsets','work-offset','operations'],sources:['haasProgramming']},
{id:'material',cat:'theory',title:'Материал, твёрдость и инструмент',subtitle:'Почему нельзя выбирать режимы только по марке стали',tags:['30ХГСА','HRC','твёрдость','сплав','режимы'],time:5,
 quick:'Одна и та же марка стали после разной термообработки обрабатывается по-разному. Для выбора фрезы важны твёрдость, структура, условия резания, покрытие и геометрия инструмента.',
 actions:['Уточни марку и фактическое состояние/твёрдость материала.','Проверь группу применимости и назначение марки сплава фрезы.','Возьми стартовые режимы из рекомендаций производителя конкретного инструмента.'],
 sections:[{h:'На примере стали 30ХГСА',p:'Указания «30ХГСА» недостаточно. После закалки и отпуска твёрдость может сильно отличаться от состояния поставки. При высокой твёрдости неподходящая кромка склонна к сколам и быстрой потере стойкости.'},{h:'Ещё важны',bullets:['Прерывистость резания и наличие корки/окалины.','Вид обработки: боковая, торцевая, пазовая.','Вылет, жёсткость, СОЖ, биение и фактическое зацепление.'] }],linked:['chipping','cutting','wear'],sources:['sandvik']},
{id:'drilling',cat:'handbook',title:'Сверление: подача на оборот',subtitle:'Не путай fn и fz',tags:['сверло','сверление','подача','fn','врезание'],time:4,
 quick:'Для сверления n = 1000 × Vc / (π × D); Vf = n × fn, где fn — подача в мм/об. Не используй формулу n × z × fz как замену подачи сверла без данных производителя.',
 actions:['Проверь материал и тип сверла.','Уточни глубину отверстия и способ отвода стружки.','Убедись в подходящем цикле, СОЖ и способе выхода.'],

function missing(){return `${header('Раздел не найден','Такой страницы пока нет.')}<a class="btn btn-primary" href="#/home">На главную</a>`}
const cfg={
 milling:{label:'Фрезерование',fields:[['D','Диаметр фрезы D','мм'],['Vc','Скорость резания Vc','м/мин'],['z','Рабочих зубьев z','шт'],['fz','Подача на зуб fz','мм/зуб'],['ap','Глубина резания ap','мм'],['ae','Ширина резания ae','мм'],['L','Длина резания L','мм']]},
 drilling:{label:'Сверление',fields:[['D','Диаметр сверла D','мм'],['Vc','Скорость резания Vc','м/мин'],['fn','Подача на оборот fn','мм/об'],['L','Длина резания L','мм']]},
 reverse:{label:'Обратный расчёт',fields:[['D','Диаметр фрезы D','мм'],['n','Обороты шпинделя n','об/мин'],['z','Рабочих зубьев z','шт'],['Vf','Минутная подача Vf','мм/мин']]},
 time:{label:'Машинное время',fields:[['L','Длина одного рабочего хода L','мм'],['Vf','Рабочая подача Vf','мм/мин'],['passes','Число одинаковых ходов','шт']]}
};
const toNum = value => {
 const s=String(value??'').trim().replace(/\s/g,'').replace(',','.');
 if(!s || !/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;
 return Number(s);
};
const pretty=(v,max=1)=>Number.isFinite(v)?new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:max}).format(v):'—';
function calculator(mode,values){const get=k=>toNum(values[k]);const keys=cfg[mode].fields.map(x=>x[0]);if(keys.some(k=>!Number.isFinite(get(k))||get(k)<=0))return {error:'Заполни все поля положительными числами (допускается десятичная запятая).'};
 if(['milling','reverse'].includes(mode)&&(!Number.isInteger(get('z'))||get('z')>100))return {error:'Число зубьев z должно быть целым положительным числом.'};
 if(mode==='time'&&(!Number.isInteger(get('passes'))||get('passes')>1000000))return {error:'Количество ходов должно быть целым положительным числом.'};
 const n=mode==='time'?null:(mode==='reverse'?get('n'):1000*get('Vc')/(Math.PI*get('D')));
 if(mode!=='time'&&(!Number.isFinite(n)||n>1e12))return {error:'Проверь значения: результат выходит за разумные пределы.'};
 if(mode==='milling'){
  if(get('ae')>get('D'))return {error:'Ширина резания ae не должна превышать диаметр фрезы D для этого упрощённого расчёта.'};
  const vf=n*get('z')*get('fz'),q=get('ap')*get('ae')*vf/1000,t=get('L')/vf;
  return {items:[['Обороты шпинделя','n',n,'об/мин',0],['Минутная подача','Vf',vf,'мм/мин',1],['Объём съёма материала','Q',q,'см³/мин',2],['Время рабочего хода','t',t,'мин',3]],note:'Q рассчитан для прямолинейного прохода с постоянными ap и ae. Время не включает холостые перемещения, разгон и смену инструмента.'};
 }
 if(mode==='drilling'){
  const vf=n*get('fn');return{items:[['Обороты шпинделя','n',n,'об/мин',0],['Минутная подача','Vf',vf,'мм/мин',1],['Время прохода','t',get('L')/vf,'мин',3]],note:'Время без входных/выходных перемещений, пауз и циклов дробления стружки. L — реальная длина движения с подачей.'};
 }
 if(mode==='reverse')return{items:[['Фактическая скорость резания','Vc',Math.PI*get('D')*n/1000,'м/мин',2],['Подача на зуб','fz',get('Vf')/(n*get('z')),'мм/зуб',4]],note:'Это восстановление параметров по заданным оборотам и минутной подаче, не проверка пригодности режима.'};
 if(mode==='time')return{items:[['Время одного прохода','t',get('L')/get('Vf'),'мин',3],['Общее время рабочих ходов','T',get('passes')*get('L')/get('Vf'),'мин',3]],note:'Упрощённая оценка постоянной подачи; не учитывает смену инструментов, холостой ход и ускорения.'};
 return {error:'Неизвестный режим'};
}
function resultsHtml(result){if(result.error)return `<div class="calc-error">${safe(result.error)}</div>`;return `<div class="eyebrow">Результат расчёта</div>${result.items.map(([label,key,v,unit,d])=>`<div class="result-block"><div class="result-value">${pretty(v,d)} <span>${safe(unit)}</span></div><div class="result-label">${safe(label)} · ${key}</div></div>`).join('')}<div class="result-extra">${safe(result.note)}</div>`}
function calcPage(){const m=state.mode;let calc=calculator(m,state.calc[m]);return `${header('Калькулятор режимов','Формулы с единицами СИ и метрическими размерами. Для расчёта используй входные значения своего инструмента.','ПРАКТИЧЕСКИЕ ИНСТРУМЕНТЫ')}
 <div class="calculator-layout calc-wrap"><div class="panel"><div class="calc-tabs" role="tablist" aria-label="Вид расчёта">${Object.entries(cfg).map(([id,c])=>`<button type="button" role="tab" aria-selected="${m===id}" class="${m===id?'active':''}" data-action="calc-mode" data-mode="${id}">${c.label}</button>`).join('')}</div>
 <div class="calc-form" role="group" aria-label="Исходные данные">${cfg[m].fields.map(([id,t,unit])=>`<div class="field"><label for="field-${id}">${safe(t)}</label><div class="field-input"><input type="text" inputmode="decimal" id="field-${id}" data-calc="${id}" value="${safe(state.calc[m][id])}" autocomplete="off" aria-label="${safe(t)}"><span class="unit">${safe(unit)}</span></div></div>`).join('')}</div>
 <div class="calc-note">Вводи десятичную точку или запятую. Результат пересчитывается автоматически.</div>
 <div class="mt-4"><button class="btn btn-sm btn-quiet" data-action="calc-example">${ic('target')} Вернуть пример</button></div>
 </div><div class="result-panel" id="calc-results" aria-live="polite">${resultsHtml(calc)}</div></div>
 <div class="mt-4">${callout('<strong>Формулы:</strong> n = 1000 · Vc / (π · D), Vf (фреза) = n · z · fz, Vf (сверло) = n · fn, Q = ap · ae · Vf / 1000. Для сферических/радиусных фрез нужен эффективный режущий диаметр.')}</div>
 <div class="mt-4">${callout('<strong>Ограничение:</strong> это калькулятор, а не подбор рекомендованных режимов. Проверь максимальные обороты шпинделя и инструмента, подачу станка, материал и жёсткость.',true)}</div>
 <section class="mt-5"><div class="section-heading"><h2>Разобраться в расчётах</h2></div><div class="related-links"><a href="#/article/cutting">Обороты и минутная подача</a><a href="#/article/drilling">Сверление</a><a href="#/article/chip">Толщина стружки</a><a href="${safe(DB.sources.sandvik.url)}" rel="noopener noreferrer" target="_blank">Источник формул ${ic('external','xs')}</a></div></section>`}
function render(keepScroll=false){let current=route(),body;
 if(current==='home')body=home();else if(current==='calc')body=calcPage();else if(current==='library')body=library();else if(current==='codes')body=codesPage();else if(current==='saved')body=savedPage();else if(current==='sources')body=sourcesPage();else if(current.startsWith('category/'))body=categoryPage(current.split('/')[1]);else if(current.startsWith('article/'))body=articlePage(current.split('/')[1]);else body=missing();
 let y=window.scrollY;qs('#app').innerHTML=shell(current,body);if(keepScroll)window.scrollTo({top:y,behavior:'instant'});
}
const defaultCalc=JSON.parse(JSON.stringify(state.calc));
let toastTimeout;
function toast(msg){let t=qs('#cnc-toast');if(!t){t=document.createElement('div');t.id='cnc-toast';t.style.cssText='position:fixed;z-index:50;bottom:82px;left:50%;transform:translateX(-50%);background:#102844;color:#fff;border-radius:10px;padding:12px 18px;font-size:13px;box-shadow:0 10px 25px #10284440;max-width:90%;text-align:center';document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{t.hidden=true},2200)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;let ac=el.dataset.action;
 if(ac==='bookmark'){let id=el.dataset.id;if(!byId(id))return;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);try{localStorage.setItem('cnc-handbook-saved',JSON.stringify([...state.saved]))}catch(_){}render(true);toast(state.saved.has(id)?'Сохранено в избранном':'Убрано из избранного')}
 if(ac==='category-filter'){state.category=el.dataset.cat;render(true)}
 if(ac==='expand'){let id=el.dataset.id;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render(true)}
 if(ac==='control'){state.control=el.dataset.control;state.codesQuery='';render(true)}
 if(ac==='calc-mode'){state.mode=el.dataset.mode;render(true)}
 if(ac==='calc-example'){state.calc[state.mode]={...defaultCalc[state.mode]};render(true);toast('Пример восстановлен')}
});
document.addEventListener('input',e=>{
 if(e.target.id==='library-search'){state.query=e.target.value;let node=qs('#library-results');if(node)node.innerHTML=libraryResults()}
 else if(e.target.id==='code-search'){state.codesQuery=e.target.value;let node=qs('#code-results');if(node)node.innerHTML=codesRows()}
 else if(e.target.dataset.calc){state.calc[state.mode][e.target.dataset.calc]=e.target.value;let node=qs('#calc-results');if(node)node.innerHTML=resultsHtml(calculator(state.mode,state.calc[state.mode]))}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.CNC_TEST={calculator,toNum,pretty,DB};
})();

</script>
</body>
</html>
